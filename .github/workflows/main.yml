
name: Build Mr.WhiteDevilsPvP

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./MrWhiteDevilsPvP_Source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Show Java version
        run: java -version

      - name: Run core unit tests
        run: sh run_core_tests.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build the mod JAR
        run: |
          grep -E '^(minecraft_version|loader_version|loom_version|fabric_api_version)=' gradle.properties
          gradle build --no-daemon --stacktrace

      - name: Verify the JAR
        run: |
          JAR=build/libs/Mr.WhiteDevilsPvP.jar
          test -f "$JAR"
          unzip -l "$JAR" > /tmp/jar-list.txt
          unzip -p "$JAR" fabric.mod.json > /tmp/fmj.json
          grep -q 'fabric.mod.json' /tmp/jar-list.txt
          grep -q 'com/mrwhitedevil/pvp/fabric/MrWhiteDevilsPvPClient.class' /tmp/jar-list.txt
          grep -q 'com/mrwhitedevil/pvp/core/PvpController.class' /tmp/jar-list.txt
          grep -q '"version": "1.0.0"' /tmp/fmj.json
          echo "JAR verification passed"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: MrWhiteDevilsPvP
          path: MrWhiteDevilsPvP_Source/build/libs/Mr.WhiteDevilsPvP.jar
          if-no-files-found: error
